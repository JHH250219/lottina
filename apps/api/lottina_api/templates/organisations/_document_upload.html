<section class="rounded-[34px] border border-white/15 bg-white/5 p-6 space-y-4">
  <p class="text-xs uppercase tracking-[0.4em] text-white/60">Datei hochladen</p>
  <form method="post" enctype="multipart/form-data" class="space-y-4">
    <input type="hidden" name="action" value="upload_file">
    <div class="grid gap-4 md:grid-cols-2">
      <label class="wizard-label text-white">
        Ordner
        <select name="folder_slug" class="wizard-input bg-white/90 text-[#0f2f2c]" required>
          {% for folder in folders %}
            <option value="{{ folder.slug }}" {% if folder.slug == active_folder_slug %}selected{% endif %}>{{ folder.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="wizard-label text-white">
        Sichtbarkeit
        <select name="visibility" class="wizard-input bg-white/90 text-[#0f2f2c]" required>
          {% for value, label in visibility_options %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <label class="wizard-label text-white">
      Datei (PDF, PNG, JPG)
      <input type="file" name="file" accept=".pdf,image/*" class="wizard-input" required>
    </label>
    <button type="submit" class="wizard-btn wizard-btn--primary w-full">Datei hochladen</button>
  </form>
</section>
