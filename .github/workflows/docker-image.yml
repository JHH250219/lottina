name: Build & Deploy API

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jhh250219/lottina-api
  DOCKERFILE: apps/api/Dockerfile

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & Push API image
        uses: docker/build-push-action@v5
        with:
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            APP_ENV=production
          no-cache: true

      - name: Trigger Sliplane deploy
        env:
          SLIPLANE_DEPLOY_URL: ${{ secrets.SLIPLANE_DEPLOY_URL }}
        run: |
          if [ -z "$SLIPLANE_DEPLOY_URL" ]; then
            echo "SLIPLANE_DEPLOY_URL secret not set" >&2
            exit 1
          fi
          curl -f -X GET "$SLIPLANE_DEPLOY_URL"
